name: medtrack_app
description: A medication reminder and tracking application for patients and caregivers.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Firebase
  firebase_core: ^2.24.2
  firebase_auth: ^4.15.3
  cloud_firestore: ^4.13.6
  firebase_messaging: ^14.7.9
  
  # State Management
  provider: ^6.1.1
  
  # Local Notifications
  flutter_local_notifications: ^16.3.0
  timezone: ^0.9.2
  
  # UI
  cupertino_icons: ^1.0.6
  intl: ^0.18.1
  
  # Utilities
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  
  # assets:
  #   - assets/images/
  #   - assets/icons/
